name: FrED Engine
version: 0.24.0
slug: fred

description: "FrED: presence inference and lighting core (LPS + Glow)"
url: https://github.com/RicardoSanchezA/fred-addon-repository
# aarch64 only: from 0.19.0 the engine image is published for it alone
# (richitacos/freds-crib publish.yml). Listing amd64 would let Supervisor
# install the add-on on an x86 box that cannot pull those releases.
arch:
  - aarch64
image: ghcr.io/richitacos/freds-crib
startup: application
boot: auto
init: false
stage: experimental
homeassistant: 2026.7.0
homeassistant_api: true
# Triage bundles (richitacos/freds-crib#153) read the engine's own Supervisor
# log (/addons/self/logs) and Home Assistant Core's (/core/logs), the latter
# for Zigbee timeouts and unavailable devices around an incident.
# `hassio_api` enables Supervisor API access; `hassio_role: homeassistant`
# is the least role that reaches /core/logs. They are separate settings.
# The role is wider than log reads: Supervisor allows it every path matching
# /.+/info, /core/.+ and /homeassistant/.+, which includes Core control
# (POST /core/restart, /core/stop, /core/update, /core/options). Code running
# in this add-on could use its token for those. The engine itself calls only
# discovery, /addons/self/info, /addons/self/logs and /core/logs. DOCS.md
# states the same for users.
hassio_api: true
hassio_role: homeassistant
ingress: true
ingress_port: 8099
# Supervisor reaches the container directly on the internal network, so the
# literal engine port is correct here. Do NOT change this to [PORT:8099]:
# that placeholder resolves against a published host port, which this add-on
# deliberately does not have -- adding a `ports:` mapping to make it resolve
# would expose 8099 on the LAN and dismantle the ingress trust boundary
# documented in DOCS.md.
watchdog: http://[HOST]:8099/live
ingress_entry: ui/
ingress_stream: true
panel_icon: mdi:floor-plan
panel_title: FrED Home
panel_admin: false
discovery:
  - fred
backup: hot
# Rolling diagnostics stay out of backups (richitacos/freds-crib#162), and so
# does the rolling LPS comparison history (richitacos/freds-crib#154): pairs a
# report cites are copied into `comparison/`, which stays in backups.
# Supervisor tests each path under /data with PurePath.match: patterns anchor
# on the right and `**` matches one segment, like `*`. So each directory is
# backed up empty and everything directly inside it is skipped, including
# subdirectories such as a triage bundle's. Keep these names unique under
# /data, because `logs/**` would also skip any other directory named `logs`.
backup_exclude:
  - "logs/**"
  - "state-history/**"
  - "feedback-bundles/**"
  - "comparison-history/**"
options:
  observer_mode: false
  max_occupants: 2
schema:
  observer_mode: bool
  max_occupants: int(1,16)
